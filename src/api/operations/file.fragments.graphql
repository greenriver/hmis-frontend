fragment FileFields on File {
  confidential
  contentType
  effectiveDate
  expirationDate
  id
  name
  url
  tags
  access {
    canEditFile
    canDeleteFile
  }
  redacted
  enrollmentId
  enrollment {
    id
  }
  uploadedBy {
    id
    name
  }
  updatedBy {
    id
    name
  }
  dateCreated
  dateUpdated
  user {
    ...UserFields
  }
}

# FileFields is also used for file-valued CustomDataElements (valueFile), so it must not itself
# select customDataElements (that would make the fragments recursive).
fragment FileWithCustomDataElementsFields on File {
  ...FileFields
  customDataElements {
    ...CustomDataElementFields
  }
}
